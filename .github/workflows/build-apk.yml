name: Build Limore Keeper APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimoreQueueKeeper-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Limore Queue Keeper v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 🎮 Limore Queue Keeper APK
            Aplikasi pendamping antrean Limore Cloud Game untuk Android Go / Redmi A2.

            ### ✨ Fitur:
            - **Keep-Alive Foreground Service**: Menahan CPU dari deep sleep dan menjaga koneksi socket background tetap aktif.
            - **Alarm Otomatis Antrean Siap**: Bunyikan alarm volume maksimal + getar saat antrean selesai.
            - **Auto-Launch**: Langsung meluncurkan aplikasi Limore ke layar depan agar tidak kehabisan batas waktu (timeout).
            - **Built for XyVerse Ecosystem**.

            ### 📲 Cara Pakai:
            1. Unduh file `app-debug.apk` di bawah.
            2. Instal di HP Redmi A2 Anda.
            3. Berikan izin Akses Notifikasi dan abaikan optimasi baterai.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
